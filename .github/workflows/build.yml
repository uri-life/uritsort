name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release build for ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            architecture: x86_64
            file_architecture: x86_64
            artifact: uritsort-macos-x86_64
            build_arguments: ""
          - os: macos-15
            platform: macos
            architecture: arm64
            file_architecture: arm64
            artifact: uritsort-macos-arm64
            build_arguments: ""
          - os: ubuntu-24.04
            platform: linux
            architecture: x86_64
            file_architecture: x86-64
            artifact: uritsort-linux-x86_64-static
            build_arguments: --static-swift-stdlib
          - os: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            file_architecture: aarch64
            artifact: uritsort-linux-arm64-static
            build_arguments: --static-swift-stdlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Swiftly and Swift 6.2.4
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Linux)
              curl -fsSL \
                "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" \
                -o "${RUNNER_TEMP}/swiftly.tar.gz"
              tar -xzf "${RUNNER_TEMP}/swiftly.tar.gz" -C "${RUNNER_TEMP}"
              swiftly_executable="${RUNNER_TEMP}/swiftly"
              swiftly_environment="${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
              ;;
            macOS)
              curl -fsSL \
                "https://download.swift.org/swiftly/darwin/swiftly.pkg" \
                -o "${RUNNER_TEMP}/swiftly.pkg"
              installer \
                -pkg "${RUNNER_TEMP}/swiftly.pkg" \
                -target CurrentUserHomeDirectory
              swiftly_executable="${HOME}/.swiftly/bin/swiftly"
              swiftly_environment="${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
              ;;
            *)
              echo "Unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          "${swiftly_executable}" init \
            --assume-yes \
            --no-modify-profile \
            --skip-install \
            --quiet-shell-followup
          # shellcheck source=/dev/null
          source "${swiftly_environment}"

          post_install_file="${RUNNER_TEMP}/swiftly-post-install.sh"
          swiftly install 6.2.4 \
            --assume-yes \
            --post-install-file="${post_install_file}"
          if test -s "${post_install_file}"; then
            if test "${RUNNER_OS}" = Linux; then
              sudo bash "${post_install_file}"
            else
              bash "${post_install_file}"
            fi
          fi

          dirname "$(command -v swiftly)" >> "${GITHUB_PATH}"

      - name: Show Swift version
        run: swiftly run swift --version +6.2.4

      - name: Build release executable
        run: swiftly run swift build -c release ${{ matrix.build_arguments }} +6.2.4

      - name: Package executable
        shell: bash
        run: |
          binary_directory="$(swiftly run swift build -c release ${{ matrix.build_arguments }} --show-bin-path +6.2.4)"
          binary_path="${binary_directory}/uritsort"
          test -x "${binary_path}"
          "${binary_path}" --help >/dev/null
          file_output="$(file "${binary_path}")"
          echo "${file_output}"
          printf '%s\n' "${file_output}" | grep -Fq "${{ matrix.file_architecture }}"
          mkdir -p artifacts
          tar -czf "artifacts/${{ matrix.artifact }}.tar.gz" \
            -C "${binary_directory}" uritsort

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          archive: false
